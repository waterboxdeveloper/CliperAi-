[project]
name = "cliper"
version = "0.1.0"
description = "Herramienta para convertir videos largos en clips cortos usando ClipsAI"
authors = [
    {name = "Tu Nombre", email = "tu@email.com"}
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "clipsai",
    "whisperx @ git+https://github.com/m-bain/whisperx.git",
    "yt-dlp>=2026.6.9",  # Versión 2026+ con soporte mejorado YouTube (requiere Deno runtime)
    "python-dotenv",
    "loguru",
    "typer",
    "tqdm",
    "pydantic",
    "ffmpeg-python",
    "rich>=14.2.0",
    "faster-whisper>=1.2.0",
    "langchain-google-genai>=2.1.12",
    "langchain-anthropic>=1.4.6",
    "langgraph>=1.0.10rc1",
    # Face reframing (PASO3)
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0.0",
    "black>=26.3.1",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0.0",
    "black>=26.3.1",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]
